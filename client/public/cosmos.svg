<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- Stars -->
    <circle cx="25" cy="30" r="2" fill="white" opacity="0.8"/>
    <circle cx="75" cy="25" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="70" cy="70" r="2" fill="white" opacity="0.7"/>
    <circle cx="30" cy="75" r="1.5" fill="white" opacity="0.5"/>
    <circle cx="50" cy="20" r="1" fill="white" opacity="0.9"/>
    <!-- Planet/Avatar -->
    <circle cx="50" cy="50" r="20" fill="#a78bfa"/>
    <circle cx="50" cy="50" r="16" fill="#8b5cf6"/>
    <!-- Eyes -->
    <ellipse cx="44" cy="48" rx="4" ry="5" fill="white"/>
    <ellipse cx="56" cy="48" rx="4" ry="5" fill="white"/>
    <circle cx="44" cy="49" r="2" fill="#1e1b4b"/>
    <circle cx="56" cy="49" r="2" fill="#1e1b4b"/>
    <!-- Smile -->
    <path d="M42 56 Q50 62 58 56" stroke="#1e1b4b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Orbit ring -->
    <ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="white" stroke-width="1.5" opacity="0.3" transform="rotate(-20 50 50)"/>
  </g>
</svg>
